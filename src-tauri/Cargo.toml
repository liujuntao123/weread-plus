[package]
name = "weread-plus"
version = "0.1.0"
description = "Desktop enhancement client for Tencent WeRead"
authors = ["weread-plus authors"]
edition = "2021"

[lib]
name = "weread_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
